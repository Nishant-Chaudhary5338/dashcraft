name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    name: "@dashcraft/core — Build & Test (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/core/package-lock.json

      - name: Install @dashcraft/core dependencies
        working-directory: packages/core
        run: npm ci --legacy-peer-deps

      - name: Type check @dashcraft/core
        working-directory: packages/core
        run: npm run typecheck

      - name: Build @dashcraft/core
        working-directory: packages/core
        run: npm run build

      - name: Test @dashcraft/core
        working-directory: packages/core
        run: npm run test

  mcp:
    name: "@dashcraft/mcp-codegen — Build"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/codegen/package-lock.json

      - name: Install @dashcraft/mcp-codegen dependencies
        working-directory: tools/codegen
        run: npm ci --legacy-peer-deps

      - name: Build MCP server
        working-directory: tools/codegen
        run: npm run build

  site:
    name: "Site — Build"
    runs-on: ubuntu-latest
    needs: core

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install @dashcraft/core dependencies
        working-directory: packages/core
        run: npm ci --legacy-peer-deps

      - name: Build @dashcraft/core
        working-directory: packages/core
        run: npm run build

      - name: Install site dependencies
        working-directory: apps/site
        run: npm ci --legacy-peer-deps

      - name: Build site
        working-directory: apps/site
        run: npm run build
