name: CI

on:
  push:
    branches: [main]
    # Don't burn CI minutes on docs-only / non-code changes.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "**/llms.txt"
      - "**/AGENTS.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".vscode/**"
      - ".editorconfig"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "**/llms.txt"
      - "**/AGENTS.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".vscode/**"
      - ".editorconfig"

jobs:
  build-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck dashcraft-core
        run: pnpm --filter dashcraft-core typecheck

      - name: Build dashcraft-core
        run: pnpm --filter dashcraft-core build

      - name: Test dashcraft-core
        run: pnpm --filter dashcraft-core test

      - name: Build dashcraft-mcp-codegen
        run: pnpm --filter dashcraft-mcp-codegen build

      - name: Build site (Next.js)
        run: pnpm --filter site build
